apiVersion: v1
kind: Service
metadata: {name: mock}
spec:
  selector: {app: mock}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mock}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mock}}
  template:
    metadata: {labels: {app: mock}}
    spec:
      containers:
        - name: mock
          image: python:3.13-alpine
          command: [python, /mock/mock-server.py]
          env:
            - {name: MOCK_BIND, value: 0.0.0.0}
            - {name: MOCK_PORT, value: '8080'}
            - {name: MOCK_FIXTURE, value: /mock/queue-settings.json}
            - {name: MOCK_STATE_FILE, value: /state/queue-settings.json}
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /health, port: 8080}, periodSeconds: 5}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
          volumeMounts:
            - {name: code, mountPath: /mock, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - {name: code, configMap: {name: mock-config}}
        - {name: state, emptyDir: {}}
